<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DarkBili TV</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo">🌙</span>
    <h1>DarkBili TV</h1>
  </header>

  <div class="row">
    <label for="enabled">Dark mode</label>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row slider-row">
    <label for="darkness">Darkness</label>
    <input type="range" id="darkness" min="0" max="100" step="1" />
    <span id="darkness-val" class="val"></span>
  </div>

  <button id="reset" class="reset-btn" type="button">Restore default darkness</button>

  <p class="hint">
    Recolors the page (not a color-invert filter) — logos, thumbnails, and
    video keep their real colors. If you just installed the extension,
    reload any open bilibili.tv tabs once.
  </p>

  <script src="popup.js"></script>
</body>
</html>
